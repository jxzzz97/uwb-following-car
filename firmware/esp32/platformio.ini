[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -I config
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192

[env:esp32-ota]
extends = env:esp32dev
upload_protocol = espota
; Set the IP and password locally; no deployment targets are committed.
upload_port = ${sysenv.FOLLOW_OTA_HOST}
upload_flags =
    --auth=${sysenv.FOLLOW_OTA_PASSWORD}
